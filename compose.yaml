services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: guestbook
      POSTGRES_PASSWORD: supersecret123
      POSTGRES_DB: guestbook

  app:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://guestbook:supersecret123@db:5432/guestbook
    depends_on:
      - db
